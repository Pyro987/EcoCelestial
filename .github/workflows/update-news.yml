name: Actualizar noticias y publicar sitio

on:
  schedule:
    # Todos los días a las 09:00 (hora Argentina, UTC-3) => 12:00 UTC
    - cron: "0 12 * * *"
  workflow_dispatch: {}   # permite ejecutarlo a mano desde la pestaña Actions
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descargar noticias de las fuentes oficiales
        run: python3 scripts/fetch_news.py

      - name: Guardar data/news.json si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git diff --staged --quiet || git commit -m "Actualización automática de noticias $(date -u +'%Y-%m-%d')"
          git push

  publish:
    needs: update-news
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el repositorio (con el último commit)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar sitio para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
